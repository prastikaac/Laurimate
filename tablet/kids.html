<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Laurimate Kids Fun</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Poppins:600,700,800');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', 'Trebuchet MS', Arial, sans-serif;
      background-color: #38BDF8;
      -webkit-user-select: none;
      user-select: none;
    }

    .kids-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .kids-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .float-slow {
      -webkit-animation: floatHoriz 5.5s ease-in-out infinite alternate;
      animation: floatHoriz 5.5s ease-in-out infinite alternate;
    }

    .float-updown {
      -webkit-animation: floatVert 2.2s ease-in-out infinite alternate;
      animation: floatVert 2.2s ease-in-out infinite alternate;
    }

    @-webkit-keyframes floatHoriz {
      0%   { -webkit-transform: translateX(-10px); transform: translateX(-10px); }
      100% { -webkit-transform: translateX(10px); transform: translateX(10px); }
    }
    @keyframes floatHoriz {
      0%   { transform: translateX(-10px); }
      100% { transform: translateX(10px); }
    }

    @-webkit-keyframes floatVert {
      0%   { -webkit-transform: translateY(6px); transform: translateY(6px); }
      100% { -webkit-transform: translateY(-10px); transform: translateY(-10px); }
    }
    @keyframes floatVert {
      0%   { transform: translateY(6px); }
      100% { transform: translateY(-10px); }
    }

    .eye-blink {
      -webkit-transform-origin: center;
      transform-origin: center;
      -webkit-animation: blinkAnim 3.2s infinite;
      animation: blinkAnim 3.2s infinite;
    }
    @-webkit-keyframes blinkAnim {
      0%, 90%, 100% { -webkit-transform: scaleY(1); transform: scaleY(1); }
      95% { -webkit-transform: scaleY(0.1); transform: scaleY(0.1); }
    }
    @keyframes blinkAnim {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* Main 3-Column Widescreen Layout (Fits Pepper tablet with zero cropping) */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      padding: 12px 18px;
    }

    /* Left & Right Touch Button Grids (3x4 buttons each = 24 Top Controls) */
    .side-grid {
      width: 312px;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-content: center;
      align-content: center;
    }

    .touch-btn {
      width: 98px;
      height: 96px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 3.5px solid #FDE047;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.26);
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      cursor: pointer;
      -webkit-transition: -webkit-transform 0.15s ease, background-color 0.15s ease;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .touch-btn:active,
    .touch-btn.active-press {
      -webkit-transform: scale(0.90);
      transform: scale(0.90);
      background: #FEF08A;
      border-color: #FF4B72;
    }

    /* Most Highlighted Hero Button: TAKE PHOTO */
    .touch-btn.photo-hero {
      background: #FF1E56;
      background: -webkit-linear-gradient(135deg, #FF1E56 0%, #FF7B00 100%);
      background: linear-gradient(135deg, #FF1E56 0%, #FF7B00 100%);
      border: 4.5px solid #FFFF00;
      box-shadow: 0 0 22px rgba(255, 255, 0, 0.95), 0 8px 20px rgba(255, 30, 86, 0.65);
      -webkit-animation: photoHeroPulse 0.95s ease-in-out infinite alternate;
      animation: photoHeroPulse 0.95s ease-in-out infinite alternate;
    }

    .touch-btn.photo-hero .btn-label {
      color: #FFFFFF;
      font-size: 13px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
      letter-spacing: 0.5px;
    }

    @-webkit-keyframes photoHeroPulse {
      0%   { -webkit-transform: scale(1); transform: scale(1); box-shadow: 0 0 16px rgba(255, 255, 0, 0.85), 0 6px 16px rgba(255, 30, 86, 0.55); }
      100% { -webkit-transform: scale(1.07); transform: scale(1.07); box-shadow: 0 0 28px rgba(255, 255, 0, 1), 0 10px 24px rgba(255, 30, 86, 0.85); }
    }
    @keyframes photoHeroPulse {
      0%   { transform: scale(1); box-shadow: 0 0 16px rgba(255, 255, 0, 0.85), 0 6px 16px rgba(255, 30, 86, 0.55); }
      100% { transform: scale(1.07); box-shadow: 0 0 28px rgba(255, 255, 0, 1), 0 10px 24px rgba(255, 30, 86, 0.85); }
    }

    .btn-icon {
      width: 46px;
      height: 46px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-bottom: 3px;
    }

    .btn-label {
      font-size: 12px;
      font-weight: 800;
      color: #1E1B4B;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1.05;
      text-align: center;
    }

    /* Center Character / Photo Stage */
    .center-stage {
      flex: 1;
      -webkit-flex: 1;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 0 6px;
    }

    .circle {
      width: 196px;
      height: 196px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      border: 7px solid #FDE047;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      cursor: pointer;
      -webkit-animation: danceBounce 0.9s ease-in-out infinite alternate;
      animation: danceBounce 0.9s ease-in-out infinite alternate;
    }

    .circle.dancing {
      -webkit-animation: partyDance 0.55s ease-in-out infinite alternate;
      animation: partyDance 0.55s ease-in-out infinite alternate;
    }

    .circle.tapped {
      -webkit-animation: jigglePop 0.45s ease;
      animation: jigglePop 0.45s ease;
    }

    @-webkit-keyframes danceBounce {
      0%   { -webkit-transform: translateY(0) scale(1); transform: translateY(0) scale(1); }
      100% { -webkit-transform: translateY(-12px) scale(1.05); transform: translateY(-12px) scale(1.05); }
    }
    @keyframes danceBounce {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    @-webkit-keyframes partyDance {
      0%   { -webkit-transform: rotate(-10deg) scale(1.02) translateY(0); transform: rotate(-10deg) scale(1.02) translateY(0); border-color: #FF4B72; }
      50%  { border-color: #38BDF8; }
      100% { -webkit-transform: rotate(10deg) scale(1.10) translateY(-12px); transform: rotate(10deg) scale(1.10) translateY(-12px); border-color: #FDE047; }
    }
    @keyframes partyDance {
      0%   { transform: rotate(-10deg) scale(1.02) translateY(0); border-color: #FF4B72; }
      50%  { border-color: #38BDF8; }
      100% { transform: rotate(10deg) scale(1.10) translateY(-12px); border-color: #FDE047; }
    }

    @-webkit-keyframes jigglePop {
      0%   { -webkit-transform: scale(1); transform: scale(1); }
      35%  { -webkit-transform: scale(1.22) rotate(-14deg); transform: scale(1.22) rotate(-14deg); }
      70%  { -webkit-transform: scale(1.18) rotate(14deg); transform: scale(1.18) rotate(14deg); }
      100% { -webkit-transform: scale(1); transform: scale(1); }
    }
    @keyframes jigglePop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.22) rotate(-14deg); }
      70%  { transform: scale(1.18) rotate(14deg); }
      100% { transform: scale(1); }
    }

    /* Captured Photo Frame & Retake Controls */
    .photo-frame {
      display: none;
      background: #ffffff;
      padding: 8px;
      border-radius: 22px;
      border: 6px solid #FDE047;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .photo-frame.visible {
      display: block;
    }

    .photo-frame img {
      display: block;
      width: 265px;
      height: 192px;
      object-fit: cover;
      border-radius: 14px;
      background: #1E1B4B;
      margin: 0 auto;
    }

    .photo-actions {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      margin-top: 8px;
    }

    .retake-btn {
      flex: 1;
      -webkit-flex: 1;
      height: 46px;
      margin-right: 6px;
      border-radius: 14px;
      background: #FF1E56;
      background: -webkit-linear-gradient(135deg, #FF1E56 0%, #FF7B00 100%);
      background: linear-gradient(135deg, #FF1E56 0%, #FF7B00 100%);
      border: 3px solid #FFFF00;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(255, 30, 86, 0.55);
      cursor: pointer;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .retake-btn:active {
      -webkit-transform: scale(0.93);
      transform: scale(0.93);
    }

    .done-btn {
      width: 78px;
      height: 46px;
      border-radius: 14px;
      background: #1E1B4B;
      border: 3px solid #38BDF8;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .done-btn:active {
      -webkit-transform: scale(0.93);
      transform: scale(0.93);
    }

    .tap-star {
      position: absolute;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      pointer-events: none;
      z-index: 50;
      -webkit-animation: popFly 0.7s ease-out forwards;
      animation: popFly 0.7s ease-out forwards;
    }

    @-webkit-keyframes popFly {
      0%   { opacity: 1; -webkit-transform: scale(0.4) translateY(0); transform: scale(0.4) translateY(0); }
      100% { opacity: 0; -webkit-transform: scale(1.7) translateY(-60px); transform: scale(1.7) translateY(-60px); }
    }
    @keyframes popFly {
      0%   { opacity: 1; transform: scale(0.4) translateY(0); }
      100% { opacity: 0; transform: scale(1.7) translateY(-60px); }
    }

    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      -webkit-transition: opacity 0.25s ease;
      transition: opacity 0.25s ease;
    }
    .flash-overlay.active {
      opacity: 0.95;
    }
  </style>
</head>
<body id="bodyEl" onclick="onScreenTap(event)">
  <div class="flash-overlay" id="flashEl"></div>
  <div class="kids-bg" id="bgEl"></div>

  <div class="screen">
    <!-- LEFT 12 TOUCH BUTTONS (3x4 Grid — Photo Hero #1, Sports, Dances & Stage Shows) -->
    <div class="side-grid">
      <div class="touch-btn photo-hero" data-cls="touch-btn photo-hero" onclick="triggerRobot(this, 'p', 'c')">
        <div class="btn-icon" id="btn-ic-p"></div>
        <div class="btn-label">PHOTO!</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'cr', 'soccer')">
        <div class="btn-icon" id="btn-ic-cr"></div>
        <div class="btn-label">SIUUUU!</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'lm', 'soccer')">
        <div class="btn-icon" id="btn-ic-lm"></div>
        <div class="btn-label">MESSI</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, '2', '2')">
        <div class="btn-icon" id="btn-ic-2"></div>
        <div class="btn-label">DISCO</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'g', '2')">
        <div class="btn-icon" id="btn-ic-g"></div>
        <div class="btn-label">FREEZE</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, '3', '3')">
        <div class="btn-icon" id="btn-ic-3"></div>
        <div class="btn-label">GUITAR</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'd', '8')">
        <div class="btn-icon" id="btn-ic-d"></div>
        <div class="btn-label">R2-D2 BOT</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, '7', '7')">
        <div class="btn-icon" id="btn-ic-7"></div>
        <div class="btn-label">WORKOUT</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, '8', '8')">
        <div class="btn-icon" id="btn-ic-8"></div>
        <div class="btn-label">MAGIC</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, '6', '6')">
        <div class="btn-icon" id="btn-ic-6"></div>
        <div class="btn-label">ROCKET</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'b', 'bday')">
        <div class="btn-icon" id="btn-ic-b"></div>
        <div class="btn-label">BIRTHDAY</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'c', 'car')">
        <div class="btn-icon" id="btn-ic-car"></div>
        <div class="btn-label">RACE CAR</div>
      </div>
    </div>

    <!-- CENTER STAGE (Animated Character or Captured Photo with Retake Button) -->
    <div class="center-stage">
      <div class="circle" id="circleEl" onclick="onAvatarTap(event)">
        <div id="iconEl"></div>
      </div>

      <div class="photo-frame" id="photoFrameEl">
        <img id="photoImgEl" src="" alt="" />
        <div class="photo-actions">
          <button class="retake-btn" onclick="retakePhoto(event)">&#128247; RETAKE PHOTO</button>
          <button class="done-btn" onclick="closePhoto(event)">BACK</button>
        </div>
      </div>
    </div>

    <!-- RIGHT 12 TOUCH BUTTONS (3x4 Grid — Kid Interactions, Stage Moves & Animals) -->
    <div class="side-grid">
      <div class="touch-btn" onclick="triggerRobot(this, 'hs', '1')">
        <div class="btn-icon" id="btn-ic-hs"></div>
        <div class="btn-label">HANDSHAKE</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'hf', 'win')">
        <div class="btn-icon" id="btn-ic-hf"></div>
        <div class="btn-label">HIGH FIVE</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'wf', '1')">
        <div class="btn-icon" id="btn-ic-wf"></div>
        <div class="btn-label">WALK &amp; HI</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'l', 'l')">
        <div class="btn-icon" id="btn-ic-l"></div>
        <div class="btn-label">BIG HUG</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'hsk', '2')">
        <div class="btn-icon" id="btn-ic-hsk"></div>
        <div class="btn-label">CLAP SONG</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'wr', '2')">
        <div class="btn-icon" id="btn-ic-wr"></div>
        <div class="btn-label">360 SPIN</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'fa', 'cow')">
        <div class="btn-icon" id="btn-ic-fa"></div>
        <div class="btn-label">FARM SHOW</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'a', 'lion')">
        <div class="btn-icon" id="btn-ic-a"></div>
        <div class="btn-label">ZOO SAFARI</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'di', 'dino')">
        <div class="btn-icon" id="btn-ic-di"></div>
        <div class="btn-label">T-REX</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'li', 'lion')">
        <div class="btn-icon" id="btn-ic-li"></div>
        <div class="btn-label">LION ROAR</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'e', 'ele')">
        <div class="btn-icon" id="btn-ic-e"></div>
        <div class="btn-label">ELEPHANT</div>
      </div>
      <div class="touch-btn" onclick="triggerRobot(this, 'do', 'dog')">
        <div class="btn-icon" id="btn-ic-do"></div>
        <div class="btn-label">PUPPY</div>
      </div>
    </div>
  </div>

  <script>
    function makeKidsBg(skyTop, skyBot, hill1, hill2, decoType) {
      var deco = '';
      if (decoType === 'rainbow') {
        deco =
          '<circle cx="480" cy="70" r="40" fill="#FDE047"/>' +
          '<circle cx="468" cy="64" r="4.5" fill="#1E1B4B"/><circle cx="492" cy="64" r="4.5" fill="#1E1B4B"/>' +
          '<path d="M 466 76 Q 480 88 494 76" fill="none" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M 270 460 A 210 210 0 0 1 690 460" fill="none" stroke="#FF5E7E" stroke-width="14" opacity="0.75"/>' +
          '<path d="M 284 460 A 196 196 0 0 1 676 460" fill="none" stroke="#FFBE3D" stroke-width="14" opacity="0.75"/>' +
          '<path d="M 298 460 A 182 182 0 0 1 662 460" fill="none" stroke="#4ADE80" stroke-width="14" opacity="0.75"/>' +
          '<path d="M 312 460 A 168 168 0 0 1 648 460" fill="none" stroke="#38BDF8" stroke-width="14" opacity="0.75"/>';
      } else if (decoType === 'disco') {
        deco =
          '<polygon points="320,0 200,500 440,500" fill="#F472B6" opacity="0.26"/>' +
          '<polygon points="640,0 520,500 760,500" fill="#38BDF8" opacity="0.26"/>' +
          '<polygon points="480,0 360,500 600,500" fill="#FDE047" opacity="0.20"/>';
      } else if (decoType === 'space') {
        deco =
          '<circle cx="480" cy="80" r="34" fill="#FB7185"/>' +
          '<ellipse cx="480" cy="80" rx="58" ry="12" fill="none" stroke="#FDE047" stroke-width="5"/>' +
          '<circle cx="340" cy="70" r="5" fill="#fff"/><circle cx="620" cy="70" r="6" fill="#FDE047"/>';
      } else if (decoType === 'hearts') {
        deco =
          '<g class="float-updown" fill="#FF4B72" opacity="0.88">' +
            '<path d="M 350 90 C 335 70 308 85 325 108 L 350 130 L 375 108 C 392 85 365 70 350 90 Z"/>' +
            '<path d="M 610 90 C 595 70 568 85 585 108 L 610 130 L 635 108 C 652 85 625 70 610 90 Z"/>' +
          '</g>';
      } else {
        deco = '<circle cx="480" cy="72" r="38" fill="#FDE047" opacity="0.92"/>';
      }

      return (
        '<svg viewBox="0 0 960 540" preserveAspectRatio="none">' +
          '<defs>' +
            '<linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="' + skyTop + '"/>' +
              '<stop offset="100%" stop-color="' + skyBot + '"/>' +
            '</linearGradient>' +
          '</defs>' +
          '<rect width="960" height="540" fill="url(#skyGrad)"/>' +
          deco +
          '<path d="M 0 435 Q 240 355 520 425 T 960 395 L 960 540 L 0 540 Z" fill="' + hill1 + '"/>' +
          '<path d="M 0 465 Q 320 405 640 455 T 960 435 L 960 540 L 0 540 Z" fill="' + hill2 + '"/>' +
        '</svg>'
      );
    }

    function makeIcon(svgContent, size) {
      var s = size || 135;
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 100 100">' + svgContent + '</svg>';
    }

    var RAW_SVGS = {

    function triggerRobot(btnEl, cmdCode, previewScene) {

        btnEl.className = baseCls + " active-press";

    }

    function setCommand(cmdNum, customSpeech, customTitle, photoTs) {
      var key = String(cmdNum !== undefined && cmdNum !== null ? cmdNum : "0");
      if (!SCENES[key]) key = "0";
      var s = SCENES[key];

      document.getElementById("bgEl").innerHTML = s.bg;

      var circle = document.getElementById("circleEl");
      var frame = document.getElementById("photoFrameEl");
      var img = document.getElementById("photoImgEl");

      if (key === "p") {
        triggerFlash();
        circle.style.display = "none";
        frame.className = "photo-frame visible";
        var ts = photoTs || new Date().getTime();
        img.src = "kids_photo.jpg?t=" + ts;
      } else {
        frame.className = "photo-frame";
        circle.style.display = "";
        circle.className = s.dance ? "circle dancing" : "circle";
        document.getElementById("iconEl").innerHTML = makeIcon(RAW_SVGS[key] || RAW_SVGS["0"], 135);
      }
    }

    function pollState() {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "kids_state.json?t=" + new Date().getTime(), true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.seq !== undefined && data.seq !== lastSeq) {
                lastSeq = data.seq;
                setCommand(data.cmd, "", "", data.seq);
              }
            } catch (e) {}
          }
        };
        xhr.send(null);
      } catch (e) {}
      setTimeout(pollState, 250);
    }

    setCommand("0", "", "");
    pollState();
  </script>
</body>
</html>
