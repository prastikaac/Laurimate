<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laurimate</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #060b18;
      font-family: 'Poppins', 'Open Sans', Arial, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }

    /* ── Subtle grid background ── */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(rgba(30, 45, 69, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 45, 69, 0.4) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Ambient glow ── */
    body::after {
      content: '';
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 174, 239, 0.07) 0%, transparent 70%);
      top: -250px;
      left: 50%;
      margin-left: -350px;
      pointer-events: none;
      z-index: 0;
    }

    /* Particle canvas */
    #particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Page layout ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    /* ═══════════════════════════════
       TOP — header
    ═══════════════════════════════ */
    .header {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      z-index: 10;
    }

    .brand-container {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }

    .brand-logo {
      height: 56px;
      margin-right: 14px;
      border-radius: 8px;
    }

    .brand-text {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-align-items: flex-start;
      align-items: flex-start;
    }

    .brand-name {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      background: none;
      -webkit-text-fill-color: #1e6540;
      color: #1e6540;
      line-height: 1;
      margin-bottom: 1px;
    }

    .byline {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ═══════════════════════════════
       CENTER — voice bubble (active states)
    ═══════════════════════════════ */
    .bubble-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      z-index: 5;
    }

    /* Wave rings (for listening state) */
    .wave-rings {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      opacity: 0;
      top: 50%;
      left: 50%;
      margin-top: -100px;
      margin-left: -100px;
      width: 200px;
      height: 200px;
    }

    /* Bubble wrapper */
    .bubble-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin-top: 20px;
    }

    /* Main bubble */
    .bubble {
      position: absolute;
      z-index: 2;
      width: 180px;
      height: 180px;
      top: 50%;
      left: 50%;
      margin-top: -90px;
      margin-left: -90px;
      border-radius: 50%;
      background-color: rgba(56, 189, 248, 0.15);
      background: -webkit-radial-gradient(38% 38%, circle, rgba(56, 189, 248, 0.22), rgba(129, 140, 248, 0.12));
      border: 2px solid rgba(56, 189, 248, 0.4);
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.3), inset 0 0 40px rgba(56, 189, 248, 0.08);
      -webkit-transition: border-color 0.5s, box-shadow 0.5s;
      transition: border-color 0.5s, box-shadow 0.5s;
    }

    .mic-icon {
      font-size: 40px;
      color: #e2e8f0;
    }

    /* ── Idle state: heartbeat double-thump ── */
    .bubble.idle {
      -webkit-animation: idle-heartbeat 2s ease-in-out infinite;
      animation: idle-heartbeat 2s ease-in-out infinite;
    }

    @-webkit-keyframes idle-heartbeat {

      0%,
      40%,
      100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.25), inset 0 0 40px rgba(56, 189, 248, 0.06);
        -webkit-transform: scale(1);
        transform: scale(1);
      }

      10% {
        box-shadow: 0 0 0 12px rgba(56, 189, 248, 0.0), inset 0 0 50px rgba(56, 189, 248, 0.1);
        -webkit-transform: scale(1.05);
        transform: scale(1.05);
      }

      25% {
        box-shadow: 0 0 0 20px rgba(56, 189, 248, 0.0), inset 0 0 60px rgba(56, 189, 248, 0.12);
        -webkit-transform: scale(1.08);
        transform: scale(1.08);
      }
    }

    @keyframes idle-heartbeat {

      0%,
      40%,
      100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.25), inset 0 0 40px rgba(56, 189, 248, 0.06);
        transform: scale(1);
      }

      10% {
        box-shadow: 0 0 0 12px rgba(56, 189, 248, 0.0), inset 0 0 50px rgba(56, 189, 248, 0.1);
        transform: scale(1.05);
      }

      25% {
        box-shadow: 0 0 0 20px rgba(56, 189, 248, 0.0), inset 0 0 60px rgba(56, 189, 248, 0.12);
        transform: scale(1.08);
      }
    }

    /* ── Listening state ── */
    .bubble.listening {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), inset 0 0 40px rgba(56, 189, 248, 0.1);
      -webkit-animation: none;
      animation: none;
    }

    .wave.listening {
      -webkit-animation: wave-expand 2s ease-out infinite;
      animation: wave-expand 2s ease-out infinite;
    }

    .wave.listening:nth-child(2) {
      -webkit-animation-delay: 0.55s;
      animation-delay: 0.55s;
    }

    .wave.listening:nth-child(3) {
      -webkit-animation-delay: 1.1s;
      animation-delay: 1.1s;
    }

    @-webkit-keyframes wave-expand {
      0% {
        opacity: 0.7;
        -webkit-transform: scale(1);
        transform: scale(1);
      }

      100% {
        opacity: 0;
        -webkit-transform: scale(2.2);
        transform: scale(2.2);
      }
    }

    @keyframes wave-expand {
      0% {
        opacity: 0.7;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(2.2);
      }
    }

    /* ── Thinking state ── */
    .bubble.thinking {
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.2), inset 0 0 40px rgba(251, 191, 36, 0.06);
      -webkit-animation: none;
      animation: none;
    }

    .think-orbit {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      margin-top: -105px;
      margin-left: -105px;
      -webkit-animation: orbit-spin 1.8s linear infinite;
      animation: orbit-spin 1.8s linear infinite;
      pointer-events: none;
    }

    .think-orbit::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fbbf24;
      top: -6px;
      left: 50%;
      margin-left: -6px;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
    }

    @-webkit-keyframes orbit-spin {
      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes orbit-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── No-speech / error state ── */
    .bubble.nospeech {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.25), inset 0 0 40px rgba(239, 68, 68, 0.08);
      -webkit-animation: error-shake 0.5s ease-in-out 1;
      animation: error-shake 0.5s ease-in-out 1;
    }

    @-webkit-keyframes error-shake {
      0% {
        -webkit-transform: translateX(0);
        transform: translateX(0);
      }

      18% {
        -webkit-transform: translateX(-10px);
        transform: translateX(-10px);
      }

      36% {
        -webkit-transform: translateX(10px);
        transform: translateX(10px);
      }

      54% {
        -webkit-transform: translateX(-8px);
        transform: translateX(-8px);
      }

      72% {
        -webkit-transform: translateX(8px);
        transform: translateX(8px);
      }

      88% {
        -webkit-transform: translateX(-4px);
        transform: translateX(-4px);
      }

      100% {
        -webkit-transform: translateX(0);
        transform: translateX(0);
      }
    }

    @keyframes error-shake {
      0% {
        transform: translateX(0);
      }

      18% {
        transform: translateX(-10px);
      }

      36% {
        transform: translateX(10px);
      }

      54% {
        transform: translateX(-8px);
      }

      72% {
        transform: translateX(8px);
      }

      88% {
        transform: translateX(-4px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .status-pill.nospeech {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.06);
    }

    /* ── Speaking state ── */
    .bubble.speaking {
      border-color: rgba(129, 140, 248, 0.8);
      box-shadow: 0 0 35px rgba(129, 140, 248, 0.4), inset 0 0 50px rgba(129, 140, 248, 0.12);
      -webkit-animation: speak-pulse 0.8s ease-in-out infinite;
      animation: speak-pulse 0.8s ease-in-out infinite;
    }

    @-webkit-keyframes speak-pulse {

      0%,
      100% {
        -webkit-transform: scale(1);
        transform: scale(1);
        box-shadow: 0 0 35px rgba(129, 140, 248, 0.35), inset 0 0 50px rgba(129, 140, 248, 0.10);
      }

      50% {
        -webkit-transform: scale(1.06);
        transform: scale(1.06);
        box-shadow: 0 0 55px rgba(129, 140, 248, 0.60), inset 0 0 70px rgba(129, 140, 248, 0.18);
      }
    }

    @keyframes speak-pulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 35px rgba(129, 140, 248, 0.35), inset 0 0 50px rgba(129, 140, 248, 0.10);
      }

      50% {
        transform: scale(1.06);
        box-shadow: 0 0 55px rgba(129, 140, 248, 0.60), inset 0 0 70px rgba(129, 140, 248, 0.18);
      }
    }

    /* ═══════════════════════════════
       STATUS PILL
    ═══════════════════════════════ */
    .status-pill {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #64748b;
      padding: 7px 18px;
      border: 1px solid #1e2d45;
      border-radius: 100px;
      background: #111827;
      -webkit-transition: color 0.4s, border-color 0.4s, background 0.4s;
      transition: color 0.4s, border-color 0.4s, background 0.4s;
    }

    .status-pill.idle {
      color: #64748b;
      border-color: #1e2d45;
    }

    .status-pill.listening {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.06);
    }

    .status-pill.thinking {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.06);
    }

    .status-pill.speaking {
      color: #818cf8;
      border-color: rgba(129, 140, 248, 0.5);
      background: rgba(129, 140, 248, 0.06);
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 8px;
    }

    .status-pill.listening .pill-dot {
      -webkit-animation: blink-dot 1s ease-in-out infinite;
      animation: blink-dot 1s ease-in-out infinite;
    }

    .status-pill.thinking .pill-dot {
      -webkit-animation: blink-dot 0.5s ease-in-out infinite;
      animation: blink-dot 0.5s ease-in-out infinite;
    }

    .status-pill.speaking .pill-dot {
      -webkit-animation: blink-dot 0.7s ease-in-out infinite;
      animation: blink-dot 0.7s ease-in-out infinite;
    }

    @-webkit-keyframes blink-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    @keyframes blink-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    /* ═══════════════════════════════
       BOTTOM — caption area (active states)
    ═══════════════════════════════ */
    .caption-area {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      width: 100%;
      min-height: 100px;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      box-sizing: border-box;
      padding-left: 60px;
      padding-right: 60px;
    }

    .caption-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
    }

    .caption-transcript {
      font-size: 17px;
      font-weight: 600;
      color: #38bdf8;
      min-height: 24px;
      margin-bottom: 10px;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 16px;
      box-sizing: border-box;
      word-wrap: break-word;
    }

    .caption-answer {
      font-size: 18px;
      font-weight: 300;
      color: #f1f5f9;
      line-height: 1.6;
      min-height: 24px;
      max-width: 820px;
      width: auto;
      margin-left: 50px;
      margin-right: 50px;
      padding: 14px 28px;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      word-wrap: break-word;
      display: inline-block;
    }

    .source-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      margin-top: 12px;
      opacity: 0;
      -webkit-transition: opacity 0.4s;
      transition: opacity 0.4s;
    }

    .source-badge.visible {
      opacity: 1;
    }

    .source-badge.faq {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
    }

    .source-badge.ai {
      background: rgba(129, 140, 248, 0.12);
      color: #818cf8;
    }

    /* ═══════════════════════════════════════════
       IDLE PANEL — Redesigned Welcome Screen
    ═══════════════════════════════════════════ */
    .idle-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      z-index: 8;
      -webkit-transition: opacity 0.5s;
      transition: opacity 0.5s;
    }

    .idle-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Animated orb centerpiece ── */
    .orb-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 20px;
      margin-top: -20px;
    }

    .orb {
      position: absolute;
      top: 0;
      left: 0;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: -webkit-radial-gradient(30% 30%, circle, rgba(0, 174, 239, 0.35), rgba(129, 140, 248, 0.2) 50%, rgba(6, 11, 24, 0) 70%);
      background: radial-gradient(circle at 30% 30%, rgba(0, 174, 239, 0.35), rgba(129, 140, 248, 0.2) 50%, rgba(6, 11, 24, 0) 70%);
      border: 1.5px solid rgba(0, 174, 239, 0.25);
      box-shadow:
        0 0 60px rgba(0, 174, 239, 0.15),
        0 0 120px rgba(129, 140, 248, 0.08),
        inset 0 0 60px rgba(0, 174, 239, 0.1);
      -webkit-animation: orb-breathe 4s ease-in-out infinite;
      animation: orb-breathe 4s ease-in-out infinite;
    }

    .orb-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(0, 174, 239, 0.12);
      pointer-events: none;
    }

    .orb-ring:nth-child(2) {
      width: 200px;
      height: 200px;
      margin-top: -100px;
      margin-left: -100px;
      -webkit-animation: ring-rotate 12s linear infinite;
      animation: ring-rotate 12s linear infinite;
    }

    .orb-ring:nth-child(3) {
      width: 240px;
      height: 240px;
      margin-top: -120px;
      margin-left: -120px;
      border-color: rgba(129, 140, 248, 0.08);
      -webkit-animation: ring-rotate 18s linear infinite reverse;
      animation: ring-rotate 18s linear infinite reverse;
    }

    /* Small dots on rings */
    .orb-ring:nth-child(2)::before {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00AEEF;
      top: -3px;
      left: 50%;
      margin-left: -3px;
      box-shadow: 0 0 8px rgba(0, 174, 239, 0.6);
    }

    .orb-ring:nth-child(3)::before {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #818cf8;
      bottom: -2px;
      left: 50%;
      margin-left: -2px;
      box-shadow: 0 0 8px rgba(129, 140, 248, 0.6);
    }

    @-webkit-keyframes orb-breathe {

      0%,
      100% {
        -webkit-transform: scale(1);
        transform: scale(1);
        box-shadow: 0 0 60px rgba(0, 174, 239, 0.15), 0 0 120px rgba(129, 140, 248, 0.08), inset 0 0 60px rgba(0, 174, 239, 0.1);
      }

      50% {
        -webkit-transform: scale(1.06);
        transform: scale(1.06);
        box-shadow: 0 0 80px rgba(0, 174, 239, 0.22), 0 0 160px rgba(129, 140, 248, 0.12), inset 0 0 80px rgba(0, 174, 239, 0.15);
      }
    }

    @keyframes orb-breathe {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 60px rgba(0, 174, 239, 0.15), 0 0 120px rgba(129, 140, 248, 0.08), inset 0 0 60px rgba(0, 174, 239, 0.1);
      }

      50% {
        transform: scale(1.06);
        box-shadow: 0 0 80px rgba(0, 174, 239, 0.22), 0 0 160px rgba(129, 140, 248, 0.12), inset 0 0 80px rgba(0, 174, 239, 0.15);
      }
    }

    @-webkit-keyframes ring-rotate {
      to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes ring-rotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Welcome text ── */
    .welcome-greeting {
      font-size: 28px;
      font-weight: 300;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      -webkit-animation: fade-slide-up 0.8s ease-out both;
      animation: fade-slide-up 0.8s ease-out both;
    }

    .welcome-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      -webkit-animation: fade-slide-up 0.8s ease-out 0.15s both;
      animation: fade-slide-up 0.8s ease-out 0.15s both;
    }

    .welcome-name .highlight {
      background: none;
      -webkit-text-fill-color: #1e6540;
      color: #1e6540;
    }

    .welcome-sub {
      font-size: 13px;
      font-weight: 400;
      color: #475569;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
      -webkit-animation: fade-slide-up 0.8s ease-out 0.3s both;
      animation: fade-slide-up 0.8s ease-out 0.3s both;
    }

    @-webkit-keyframes fade-slide-up {
      from {
        opacity: 0;
        -webkit-transform: translateY(12px);
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        -webkit-transform: translateY(0);
        transform: translateY(0);
      }
    }

    @keyframes fade-slide-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Wake word section ── */
    .wake-section {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-align-items: center;
      align-items: center;
      -webkit-animation: fade-slide-up 0.8s ease-out 0.45s both;
      animation: fade-slide-up 0.8s ease-out 0.45s both;
    }

    .wake-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 12px;
    }

    .wake-chips {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .wake-chip {
      font-size: 14px;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 100px;
      border: 1px solid rgba(0, 174, 239, 0.3);
      color: #38bdf8;
      background: rgba(0, 174, 239, 0.06);
      -webkit-transition: all 0.3s;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .wake-chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: -webkit-linear-gradient(left, transparent, rgba(0, 174, 239, 0.08), transparent);
      background: linear-gradient(90deg, transparent, rgba(0, 174, 239, 0.08), transparent);
      -webkit-animation: chip-shimmer 3s ease-in-out infinite;
      animation: chip-shimmer 3s ease-in-out infinite;
    }

    .wake-chip:nth-child(2)::before {
      -webkit-animation-delay: 0.5s;
      animation-delay: 0.5s;
    }

    .wake-chip:nth-child(3)::before {
      -webkit-animation-delay: 1s;
      animation-delay: 1s;
    }

    .wake-chip:nth-child(4)::before {
      -webkit-animation-delay: 1.5s;
      animation-delay: 1.5s;
    }

    @-webkit-keyframes chip-shimmer {
      0% {
        left: -100%;
      }

      50%,
      100% {
        left: 100%;
      }
    }

    @keyframes chip-shimmer {
      0% {
        left: -100%;
      }

      50%,
      100% {
        left: 100%;
      }
    }

    /* ── Bottom credit line ── */
    .bottom-credit {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #334155;
      z-index: 10;
    }

    .bottom-credit .dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #334155;
      margin: 0 6px;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>

  <div class="page">

    <!-- ── HEADER ── -->
    <div class="header">
      <div class="brand-container">
        <img src="laurea.png" alt="Laurea" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-name">Laurimate</div>
          <div class="byline">Campus AI Assistant</div>
        </div>
      </div>
    </div>

    <!-- ── VOICE BUBBLE (active states) ── -->
    <div class="bubble-area">

      <!-- Status pill -->
      <div class="status-pill idle" id="status-pill" style="display: none;">
        <div class="pill-dot"></div>
        <span id="status-text">Ready</span>
      </div>

      <!-- Bubble + wave rings -->
      <div class="bubble-wrap" id="bubble-wrap" style="display: none;">
        <div class="wave-rings" id="wave-rings">
          <div class="wave" id="w1"></div>
          <div class="wave" id="w2"></div>
          <div class="wave" id="w3"></div>
        </div>
        <div class="think-orbit" id="think-orbit" style="display:none;"></div>
        <div class="bubble idle" id="bubble">
          <div class="mic-icon" id="mic-icon"></div>
        </div>
      </div>
    </div>

    <!-- ── CAPTION (active states) ── -->
    <div class="caption-area">
      <div class="caption-label" id="caption-label" style="display:none;"></div>
      <div class="caption-transcript" id="caption-transcript" style="display:none;"></div>
      <div class="caption-answer" id="caption-answer" style="display:none;"></div>
    </div>

    <!-- ═══════════════════════════════════════
         IDLE PANEL — Beautiful Welcome Screen
    ═══════════════════════════════════════ -->
    <div class="idle-panel" id="idle-panel">

      <!-- Animated orb -->
      <div class="orb-container">
        <div class="orb"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
      </div>

      <!-- Greeting -->
      <div class="welcome-greeting">Hello, I'm</div>
      <div class="welcome-name"><span class="highlight">Laurimate</span> — Your Campus Guide</div>
      <div class="welcome-sub">Voice-powered AI assistant for Laurea University</div>

      <!-- Wake words -->
      <div class="wake-section">
        <div class="wake-label">Say to wake me up</div>
        <div class="wake-chips">
          <span class="wake-chip">"Hello"</span>
          <span class="wake-chip">"Hi"</span>
          <span class="wake-chip">"Hey"</span>
          <span class="wake-chip">"Hello Laurimate"</span>
        </div>
      </div>



    </div>

    <!-- Bottom credit -->
    <div class="bottom-credit">
      Built by Prasiddha & Rakesh
    </div>

  </div>

  <script>
    /* ═══════════════════════════════
       PARTICLE BACKGROUND
    ═══════════════════════════════ */
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var maxP = 35;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function Particle() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.r = Math.random() * 1.5 + 0.5;
        this.alpha = Math.random() * 0.3 + 0.1;
        var colors = ['0,174,239', '129,140,248', '110,231,183'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      for (var i = 0; i < maxP; i++) particles.push(new Particle());

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + p.color + ',' + p.alpha + ')';
          ctx.fill();

          // draw lines between nearby particles
          for (var j = i + 1; j < particles.length; j++) {
            var q = particles[j];
            var dx = p.x - q.x;
            var dy = p.y - q.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = 'rgba(0,174,239,' + (0.06 * (1 - dist / 120)) + ')';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ═══════════════════════════════
       DOM refs (unchanged)
    ═══════════════════════════════ */
    var pill = document.getElementById('status-pill');
    var pillText = document.getElementById('status-text');
    var bubble = document.getElementById('bubble');
    var w1 = document.getElementById('w1');
    var w2 = document.getElementById('w2');
    var w3 = document.getElementById('w3');
    var thinkOrbit = document.getElementById('think-orbit');
    var idlePanel = document.getElementById('idle-panel');
    var capLabel = document.getElementById('caption-label');
    var capTrans = document.getElementById('caption-transcript');
    var capAnswer = document.getElementById('caption-answer');

    var micIcon = document.getElementById('mic-icon');

    var autoTimer = null;
    var bubbleWrap = document.getElementById('bubble-wrap');

    /* ── helpers ── */
    function setPill(state, label) {
      pill.className = 'status-pill ' + state;
      pillText.textContent = label;
    }

    function setBubble(state) {
      bubble.className = 'bubble ' + state;
    }

    function showWaves(on) {
      var cls = on ? 'listening' : '';
      [w1, w2, w3].forEach(function (w) { w.className = 'wave ' + cls; });
    }

    function showThinkOrbit(on) {
      thinkOrbit.style.display = on ? 'block' : 'none';
    }

    function showHints(on) {
      idlePanel.classList.toggle('hidden', !on);
    }

    function showCaption(label, transcript, answer) {
      capLabel.textContent = label || '';
      capLabel.style.display = label ? '' : 'none';
      capTrans.textContent = transcript || '';
      capTrans.style.display = transcript ? '' : 'none';
      capAnswer.textContent = answer || '';
      capAnswer.style.display = answer ? '' : 'none';
    }

    function clearAuto() {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    /* ══════════════════════════════════
       Python-callable functions
    ══════════════════════════════════ */

    /* Startup / between questions */
    function showWelcome() {
      clearAuto();
      setPill('idle', 'Ready');
      setBubble('idle');
      showWaves(false);
      showThinkOrbit(false);
      bubbleWrap.style.display = 'none';
      pill.style.display = 'none';
      micIcon.innerHTML = '';
      showHints(true);
      showCaption('', '', '');
    }

    /* Speech detected — recording */
    function showListening() {
      clearAuto();
      setPill('listening', 'Listening');
      setBubble('listening');
      showWaves(true);
      showThinkOrbit(false);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '';
      showHints(false);
      showCaption('Speak your question…', '', '');
    }

    /* Live text appearing while user is still speaking */
    function showLiveText(text) {
      clearAuto();
      setPill('listening', 'Listening');
      setBubble('listening');
      showWaves(true);
      showThinkOrbit(false);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '';
      showHints(false);
      showCaption('I heard so far…', '"' + text + '"', '');
    }

    /* Waiting for Firebase / Gemini */
    function showThinking() {
      clearAuto();
      setPill('thinking', 'Thinking');
      setBubble('thinking');
      showWaves(false);
      showThinkOrbit(true);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '';
      showHints(false);
      showCaption('Stopped listening', '', 'Looking that up for you…');
    }

    /* Show user's question immediately after STT returns */
    function showTranscript(transcript) {
      clearAuto();
      setPill('thinking', 'Processing');
      setBubble('thinking');
      showWaves(false);
      showThinkOrbit(true);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '';
      showHints(false);
      showCaption('You asked', '"' + transcript + '"', 'Finding the best answer…');
    }

    /* Final answer — source: "faq" or "ai" */
    function showAnswer(question, answer, source) {
      clearAuto();
      setPill('speaking', 'Responding');
      setBubble('speaking');
      showWaves(false);
      showThinkOrbit(false);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '';
      showHints(false);
      showCaption('You said', '"' + question + '"', answer);
    }

    /* No speech detected — show friendly error then reset */
    function showNoSpeech() {
      clearAuto();
      setPill('nospeech', 'Missed');
      setBubble('nospeech');
      showWaves(false);
      showThinkOrbit(false);
      bubbleWrap.style.display = '';
      pill.style.display = '';
      micIcon.innerHTML = '&#x1F614;'; /* sad face emoji */
      showHints(false);
      showCaption('', "Sorry, I couldn't catch that.", 'Please speak a little louder or try again.');

      autoTimer = setTimeout(function () {
        showWelcome();
      }, 4000);
    }
  </script>
</body>

</html>
